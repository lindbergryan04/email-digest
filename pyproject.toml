[project]
name = "email-digest"
version = "0.1.0"
description = "Pull recent email from your Gmail accounts, triage it with Claude, and print a prioritized terminal digest."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.92.0",
    "google-auth>=2.30.0",
    "google-auth-oauthlib>=1.2.0",
    "google-api-python-client>=2.130.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
email-digest = "email_digest.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/email_digest"]

[dependency-groups]
dev = ["pytest>=8"]
